<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Org Chart</title>
    <style>
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex;
        flex-direction: column;
        background: #eef1f5;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        color: #1a1a1a;
      }
      #viewStage {
        flex: 1;
        min-height: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        overflow: auto;
      }
      #viewStage svg { display: block; }
      .view-empty { color: #6b7280; font-size: 15px; }
      .view-foot {
        flex: none;
        display: flex;
        align-items: center;
        gap: 14px 20px;
        flex-wrap: wrap;
        justify-content: center;
        padding: 8px 16px 12px;
        background: rgba(255, 255, 255, 0.72);
        border-top: 1px solid rgba(0, 0, 0, 0.06);
        font-size: 12px;
      }
      .view-legend { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
      .lg-label { text-transform: uppercase; letter-spacing: 0.05em; color: #6b7280; font-size: 10.5px; font-weight: 700; }
      .lg-item { display: inline-flex; align-items: center; gap: 5px; color: #374151; }
      .lg-sw { width: 13px; height: 13px; border-radius: 3px; }
      .lg-sw.dashed { border: 1.5px dashed rgba(0, 0, 0, 0.35); }
      .view-note { color: #6b7280; }
      .view-note b { color: #374151; }
    </style>
  </head>
  <body>
    <div id="viewStage"><div class="view-empty">Loading…</div></div>
    <footer class="view-foot">
      <div class="view-legend" id="viewLegend"></div>
      <span class="view-note"><b>View only</b> · updates live</span>
    </footer>
    <script type="module" src="./src/viewer.js"></script>
  </body>
</html>
