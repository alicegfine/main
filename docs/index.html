<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loading…</title>
  <style>
    :root {
      --ink: #1a1a1a;
      --paper: #fffefb;
      --measure: 38rem;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.125rem;
      line-height: 1.65;
    }
    main {
      max-width: var(--measure);
      margin: 0 auto;
      padding: 4rem 1.5rem 6rem;
    }
    /* Justified, auto-hyphenated body text */
    main p,
    main li,
    main blockquote {
      text-align: justify;
      text-justify: inter-word;
      hyphens: auto;
      -webkit-hyphens: auto;
      -ms-hyphens: auto;
      orphans: 2;
      widows: 2;
    }
    h1, h2, h3 {
      line-height: 1.2;
      font-weight: 700;
      margin: 2.5rem 0 1rem;
      text-align: left;
      hyphens: none;
    }
    h1 { font-size: 2rem; margin-top: 0; }
    h2 { font-size: 1.5rem; }
    h3 { font-size: 1.2rem; }
    p { margin: 0 0 1.2rem; }
    a { color: #0b5fa5; }
    ul { padding-left: 1.4rem; margin: 0 0 1.2rem; }
    li { margin: 0 0 0.4rem; }
    blockquote {
      margin: 0 0 1.2rem;
      padding-left: 1rem;
      border-left: 3px solid #ddd;
      color: #555;
      font-style: italic;
    }
    hr {
      border: none;
      border-top: 1px solid #e2e2e2;
      margin: 2.5rem 0;
    }
    code {
      font-family: ui-monospace, Menlo, Consolas, monospace;
      font-size: 0.9em;
      background: #f3f1ec;
      padding: 0.1em 0.35em;
      border-radius: 3px;
    }
    @media (max-width: 480px) {
      main { padding: 2.5rem 1.25rem 4rem; }
      body { font-size: 1.0625rem; }
    }
  </style>
</head>
<body>
  <main id="content">Loading…</main>

  <script>
    // ---- Minimal Markdown renderer (headings, paragraphs, lists,
    //      blockquotes, bold, italic, code, links, horizontal rules) ----
    function escapeHtml(s) {
      return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function inline(s) {
      // order matters: escape first, then apply inline styles
      s = escapeHtml(s);
      s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
      s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,
            '<a href="$2" rel="noopener">$1</a>');
      s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      s = s.replace(/\*([^*]+)\*/g, "<em>$1</em>");
      return s;
    }

    function render(md) {
      const lines = md.replace(/\r\n?/g, "\n").split("\n");
      let html = "";
      let i = 0;
      while (i < lines.length) {
        let line = lines[i];

        // blank line
        if (/^\s*$/.test(line)) { i++; continue; }

        // horizontal rule
        if (/^\s*---+\s*$/.test(line)) { html += "<hr>"; i++; continue; }

        // headings
        let h = line.match(/^(#{1,3})\s+(.*)$/);
        if (h) {
          const level = h[1].length;
          html += `<h${level}>${inline(h[2].trim())}</h${level}>`;
          i++; continue;
        }

        // unordered list
        if (/^\s*[-*]\s+/.test(line)) {
          html += "<ul>";
          while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) {
            html += "<li>" + inline(lines[i].replace(/^\s*[-*]\s+/, "")) + "</li>";
            i++;
          }
          html += "</ul>";
          continue;
        }

        // blockquote
        if (/^\s*>\s?/.test(line)) {
          let quote = [];
          while (i < lines.length && /^\s*>\s?/.test(lines[i])) {
            quote.push(lines[i].replace(/^\s*>\s?/, ""));
            i++;
          }
          html += "<blockquote>" + inline(quote.join(" ")) + "</blockquote>";
          continue;
        }

        // paragraph: gather consecutive non-blank, non-special lines
        let para = [];
        while (
          i < lines.length &&
          !/^\s*$/.test(lines[i]) &&
          !/^(#{1,3})\s+/.test(lines[i]) &&
          !/^\s*[-*]\s+/.test(lines[i]) &&
          !/^\s*>\s?/.test(lines[i]) &&
          !/^\s*---+\s*$/.test(lines[i])
        ) {
          para.push(lines[i]);
          i++;
        }
        html += "<p>" + inline(para.join(" ")) + "</p>";
      }
      return html;
    }

    fetch("content.md", { cache: "no-store" })
      .then(function (r) {
        if (!r.ok) throw new Error("Could not load content.md (" + r.status + ")");
        return r.text();
      })
      .then(function (md) {
        const el = document.getElementById("content");
        el.innerHTML = render(md);
        // set the browser tab title from the first heading
        const firstHeading = el.querySelector("h1, h2, h3");
        if (firstHeading) document.title = firstHeading.textContent;
      })
      .catch(function (err) {
        document.getElementById("content").innerHTML =
          "<p>" + escapeHtml(err.message) + "</p>";
      });
  </script>
</body>
</html>
